[workspace]
members = ["crates/chinese-chess", "crates/gomoku", "crates/voxel-world"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
ash = "0.38"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
cpal = "=0.18.2"
ctrlc = { version = "3.5", features = ["termination"] }
egui = "=0.36.2"
egui-wgpu = { version = "=0.36.2", default-features = false }
env_logger = "0.11"
glam = { version = "0.30", features = ["serde"] }
libc = "0.2"
log = "0.4"
miniz_oxide = "0.9"
png = "0.18"
pollster = "0.4"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
wgpu-hal = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
